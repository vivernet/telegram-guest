name: telegram-guest
label: Telegram Guest Mode
kind: standalone
version: 1.3.1
requires_hermes: ">=0.23.0"
description: >
  Adds native Telegram Guest Mode support through Hermes' platform-handler
  API and a thin delivery adapter. Normal Telegram traffic stays upstream.
  Guest session history is persistent by default (host chat + caller, isolated
  by Telegram message thread when present) with /clean and /del commands.
author: Aster + Roz
